# Query to get all packages with their paths and available tasks.
#
# Run it against the query endpoint `turbo query` serves (`turbo query --help`);
# this repo ships no `.graphqlrc.yml` and no schema-generation script, so there
# is no editor wiring to configure — paste the query or pass this file with
# `turbo query lib/turbo/packages-with-tasks.gql`.
query PackagesWithTasks {
	packages {
		items {
			name
			path
			tasks {
				items {
					name
				}
			}
		}
	}
}
